# =====================================================================
# Déploiement — API Laravel, worker de file d'attente, et site Vue.
#
# Render n'a pas de runtime PHP natif : l'API passe par une image Docker
# (api/Dockerfile). Le frontend est un site statique, servi sans serveur.
#
# Aucun secret ici. Les valeurs marquées `sync: false` sont saisies dans
# l'interface de Render et ne sont jamais versionnées.
#
# Les trois adresses publiques — APP_URL, FRONTEND_URL, VITE_API_BASE — sont
# elles aussi saisies à la main bien qu'elles n'aient rien de secret :
# `fromService … property: host` rend un nom d'hôte nu, sans « https:// ».
# Une base d'API sans schéma serait lue comme un chemin relatif, et une
# origine sans schéma ne correspondrait à aucun en-tête Origin.
# =====================================================================

# ---------------------------------------------------------------------
# Variables partagées par l'API et le worker.
#
# Le worker exécute le même code : il lui faut la même base, le même
# expéditeur de courrier et la même clé de chiffrement. Deux jeux de
# valeurs divergeraient au premier oubli.
# ---------------------------------------------------------------------
envVarGroups:
  - name: goldshop-commun
    envVars:
      - key: APP_NAME
        value: GOLDSHOP
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr

      # `php artisan key:generate --show` en local, puis coller la valeur.
      # La changer plus tard rend illisible tout ce qui a été chiffré avant.
      - key: APP_KEY
        sync: false

      # Neon. Le point d'accès « -pooler » passe par PgBouncer, qui ne
      # supporte pas les requêtes préparées nommées : d'où EMULATE_PREPARES,
      # sans quoi les migrations échouent en SQLSTATE[25P02].
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_EMULATE_PREPARES
        value: true

      # Fichier plutôt que base : ce cache existe précisément pour éviter
      # des allers-retours vers Neon ; l'y héberger n'apporterait rien.
      # Il est propre à chaque instance et repart vide à chaque déploiement,
      # ce qui convient à un cache de lecture.
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file

      # `sync` et non `database` : sans worker — Render n'en offre pas en
      # gratuit — les tâches mises en file resteraient dans la table `jobs`
      # sans que personne ne les dépile, et aucun courriel ne partirait.
      # En `sync`, l'envoi a lieu dans la requête. Voir la note sur la file
      # d'attente plus bas.
      - key: QUEUE_CONNECTION
        value: sync

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: GOLDSHOP

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

services:
  # -------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------
  - type: web
    name: goldshop-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    region: frankfurt

    # Offre gratuite : le conteneur s'endort après une période sans trafic,
    # et le visiteur suivant attend son réveil — de l'ordre de la minute
    # pour une image PHP. Passer à `starter` le jour où la boutique reçoit
    # de vrais clients : le réveil à froid coûte plus en ventes perdues
    # qu'en abonnement.
    plan: free

    # `/up` est le point de santé déclaré dans bootstrap/app.php. Il ne
    # touche pas la base : un incident Neon ne doit pas faire redémarrer en
    # boucle un service par ailleurs sain.
    healthCheckPath: /up

    # `preDeployCommand` ferait tourner les migrations avant la mise en
    # service, mais c'est une fonction des plans payants. Elles sont donc
    # lancées au démarrage du conteneur, par docker-entrypoint.sh, sous
    # RUN_MIGRATIONS. Le risque habituel — plusieurs instances les exécutant
    # en parallèle — ne se pose pas ici : l'offre gratuite n'en donne qu'une.

    envVars:
      - fromGroup: goldshop-commun

      # Voir ci-dessus. À repasser à false le jour où les migrations
      # reviendront dans un `preDeployCommand`.
      - key: RUN_MIGRATIONS
        value: true

      # Adresse publique de l'API, https:// compris.
      - key: APP_URL
        sync: false

      # Origine du site, https:// compris. Lue par config/cors.php pour
      # n'autoriser qu'elle, et par les courriels pour leurs liens.
      - key: FRONTEND_URL
        sync: false

      # Sanctum attend un domaine nu, sans schéma : `property: host`
      # convient ici, contrairement aux trois adresses ci-dessus.
      - key: SANCTUM_STATEFUL_DOMAINS
        fromService:
          type: web
          name: goldshop-site
          property: host

      # Facultatif : la connexion Google n'est pas proposée par l'interface
      # actuelle. À renseigner seulement si elle est remise en service.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # -------------------------------------------------------------------
  # Pas de worker de file d'attente.
  #
  # Render ne propose aucune offre gratuite pour les processus d'arrière-
  # plan. QUEUE_CONNECTION vaut donc `sync` dans le groupe commun : les
  # courriels partent dans la requête elle-même, au lieu de s'empiler dans
  # une table que personne ne dépile.
  #
  # Conséquence à connaître : la campagne aux abonnés
  # (POST /api/send-bulk-email) boucle sur toute la liste en synchrone et
  # expirera passé quelques dizaines d'inscrits. Les courriels unitaires —
  # vérification d'adresse, réinitialisation de mot de passe — ne posent
  # aucun problème.
  #
  # Pour rétablir la file : remettre QUEUE_CONNECTION à `database` et
  # redéclarer ici un service `worker` en plan payant, avec
  # `dockerCommand: php artisan queue:work --tries=3 --backoff=60
  # --max-time=3600`.
  # -------------------------------------------------------------------

  # -------------------------------------------------------------------
  # Site
  # -------------------------------------------------------------------
  - type: web
    name: goldshop-site
    runtime: static
    buildCommand: cd front-vue && npm ci && npm run build
    staticPublishPath: ./front-vue/dist

    envVars:
      # Adresse publique de l'API, https:// compris.
      - key: VITE_API_BASE
        sync: false

    routes:
      # Le routeur Vue est en mode history : une URL profonde comme
      # /catalogue n'a pas de fichier correspondant sur le disque. Sans
      # cette règle, tout lien partagé et tout rechargement rendraient 404.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        # Vite appose une empreinte au nom des fichiers : sous un même nom,
        # le contenu ne change jamais.
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
